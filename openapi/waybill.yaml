openapi: 3.0.3
info:
  title: Waybill API
  version: 0.8.0
  description: |
    Waybill lets small web3 teams pay Nigerian contractors in stablecoins and
    lets contractors receive naira, with every payment trackable.
    Test networks and provider sandboxes only.

    This file is the contract. Go server types and TypeScript types are
    generated from it; run `make gen` after editing.

    **Amounts are never JSON numbers.** An amount is an object with the
    asset, the value in minor units as a decimal string, and the asset's
    scale, so no client can round it through a floating-point type.

    **Errors** use RFC 9457 `application/problem+json`.
servers:
  - url: /
tags:
  - name: system
    description: Service status.
  - name: invoices
    description: Contractor invoices and their payment links.
  - name: public
    description: Pages anyone with the link can open.
  - name: keys
    description: The contractor's own API keys.
  - name: webhooks
    description: Signed event notifications to the contractor's servers.
  - name: payouts
    description: The contractor's bank account and naira payouts.
  - name: providers
    description: Callbacks from payment providers. Not for clients.
  - name: org
    description: A payer organisation, its members and roles, and its funding.
  - name: batches
    description: Paying several contractors' wallets in one transaction, with approval.
  - name: documents
    description: Invoices, receipts and the accountant export.
paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Report service health.
      description: |
        Returns 200 when the API and its database are reachable, and 503 with
        the same body when the database is unavailable.
      responses:
        "200":
          description: The service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The service is running but a dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /v1/invoices:
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create an invoice and its payment link.
      description: |
        Creates an invoice for the authenticated contractor, with a deposit
        address per supported network. Retrying with the same
        `Idempotency-Key` and body returns the original response; reusing the
        key with a different body is a 422.
      security:
        - contractorKey: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"

  /v1/pay/{code}:
    get:
      operationId: getPayment
      tags: [public]
      summary: What a payer sees when opening a payment link.
      parameters:
        - $ref: "#/components/parameters/TrackingCode"
      responses:
        "200":
          description: The payment link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLink"
        "404":
          $ref: "#/components/responses/Problem"

  /v1/track/{code}:
    get:
      operationId: getTracking
      tags: [public]
      summary: The four-step tracking view of a payment.
      parameters:
        - $ref: "#/components/parameters/TrackingCode"
      responses:
        "200":
          description: The tracking view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tracking"
        "404":
          $ref: "#/components/responses/Problem"

  /v1/track/{code}/events:
    get:
      operationId: streamTracking
      tags: [public]
      summary: Live tracking updates as Server-Sent Events.
      description: |
        Each event has `event: tracking`, an `id` (send it back as
        `Last-Event-ID` to resume) and a `data` line holding a `Tracking`
        object. The current state is sent immediately on connect.
      parameters:
        - $ref: "#/components/parameters/TrackingCode"
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: An event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/Problem"

  /v1/api-keys:
    post:
      operationId: createApiKey
      tags: [keys]
      summary: Create an API key.
      description: |
        Creates a new key for the authenticated contractor. The full key is in
        this response only; Waybill stores a SHA-256 hash of it and cannot
        show it again. Keys are always test-mode (`wb_test_…`).

        Retrying with the same `Idempotency-Key` and body does not create a
        second key and cannot return the first one again: it is a 409 whose
        `detail` names the key that was created. Revoke it if it was not
        saved. The same key with a different body is a 422.
      security:
        - contractorKey: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Created. `key` is shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    get:
      operationId: listApiKeys
      tags: [keys]
      summary: List the contractor's API keys, newest first.
      description: Secrets are never returned; each key is identified by its public prefix.
      security:
        - contractorKey: []
      responses:
        "200":
          description: The keys, including revoked ones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        "401":
          $ref: "#/components/responses/Problem"

  /v1/api-keys/{id}:
    delete:
      operationId: revokeApiKey
      tags: [keys]
      summary: Revoke an API key.
      description: |
        The key stops working at once. Revoking is permanent and idempotent:
        revoking a revoked key is a 204. Revoking the contractor's last active
        key is a 409, so nobody locks themselves out.
      security:
        - contractorKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /v1/webhook-endpoints:
    post:
      operationId: createWebhookEndpoint
      tags: [webhooks]
      summary: Register a URL to receive signed events.
      description: |
        Waybill POSTs a `WebhookEvent` to `url` for each subscribed event,
        signed as described on `WebhookEvent`. The signing secret is in this
        response only. A retry with the same `Idempotency-Key` and body is a
        409 naming the endpoint, as for API keys.

        `url` must be `https` on a public host. Private, loopback and
        link-local addresses are refused here and again at delivery time
        (after DNS resolution), so a webhook cannot reach Waybill's own
        network. Local development may allow `http://localhost` through
        server configuration; the API never does by default.
      security:
        - contractorKey: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookEndpointRequest"
      responses:
        "201":
          description: Created. `secret` is shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedWebhookEndpoint"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    get:
      operationId: listWebhookEndpoints
      tags: [webhooks]
      summary: List the contractor's webhook endpoints.
      security:
        - contractorKey: []
      responses:
        "200":
          description: The endpoints, without secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointList"
        "401":
          $ref: "#/components/responses/Problem"

  /v1/webhook-endpoints/{id}:
    delete:
      operationId: deleteWebhookEndpoint
      tags: [webhooks]
      summary: Stop sending events to an endpoint.
      description: |
        Disables the endpoint; no new deliveries are created and pending
        retries are cancelled. Its delivery log is kept. Idempotent.
      security:
        - contractorKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Disabled.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /v1/webhook-endpoints/{id}/deliveries:
    get:
      operationId: listWebhookDeliveries
      tags: [webhooks]
      summary: The delivery log for an endpoint, newest first.
      description: One entry per attempt, with the response status and latency.
      security:
        - contractorKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - name: before
          in: query
          required: false
          description: Return attempts older than this delivery id (from the previous page).
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: A page of attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /v1/banks:
    get:
      operationId: listBanks
      tags: [payouts]
      summary: Nigerian banks that can receive payouts.
      description: Codes to use in `PUT /v1/me/bank-account`. Cached from the provider for a day.
      security:
        - contractorKey: []
      responses:
        "200":
          description: The banks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankList"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"

  /v1/me/bank-account:
    get:
      operationId: getBankAccount
      tags: [payouts]
      summary: The contractor's payout bank account.
      security:
        - contractorKey: []
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankAccount"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: setBankAccount
      tags: [payouts]
      summary: Set or change the payout bank account.
      description: |
        Waybill asks the bank for the account's name and saves the account
        only if it matches the contractor's legal name (every part of the
        legal name present, in any order). A mismatch is a 422 showing the
        name the bank holds. If the bank cannot be reached the account is
        not saved and the answer is 503: "could not verify" is never
        "verified".

        Payouts to a changed account wait 24 hours (`payoutsAllowedFrom`),
        so a stolen API key cannot redirect money at once.
      security:
        - contractorKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetBankAccountRequest"
      responses:
        "200":
          description: Verified and saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankAccount"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"

  /v1/invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: One of the contractor's invoices, with its quote and payout.
      security:
        - contractorKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The invoice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /v1/invoices/{id}/accept-shortfall:
    post:
      operationId: acceptShortfall
      tags: [invoices]
      summary: Accept an underpaid invoice as paid.
      description: |
        Moves an `underpaid` invoice to `confirmed` (the underpaid amount
        settles as is). Only the invoice's contractor can do this. Repeating
        it on an invoice that is already past `underpaid` is a 409.
      security:
        - contractorKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /v1/pay/{code}/checkout:
    post:
      operationId: startCheckout
      tags: [public]
      summary: Pay a link in naira by card or bank transfer.
      description: |
        Starts a Paystack test-mode checkout for the invoice's amount at its
        locked rate and returns the page to send the payer to. Repeating it
        for the same link returns the same checkout while it is open.
        Available only for invoices with a naira quote that has not
        expired.
      parameters:
        - $ref: "#/components/parameters/TrackingCode"
      responses:
        "200":
          description: The checkout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checkout"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"

  /v1/providers/paystack/webhook:
    post:
      operationId: paystackWebhook
      tags: [providers]
      summary: Paystack event callback.
      description: |
        Paystack posts transfer and charge events here. The handler checks
        `x-paystack-signature` (HMAC-SHA512 of the raw body with the secret
        key) before reading anything, stores the raw body, and processes
        each event id once (I14). It answers 200 as soon as the event is
        stored; the work happens in the worker. A bad signature is a 401
        and nothing is stored.
      parameters:
        - name: x-paystack-signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Stored (or already stored).
        "401":
          $ref: "#/components/responses/Problem"

  /v1/org:
    get:
      operationId: getOrg
      tags: [org]
      summary: The caller's organisation.
      security:
        - memberKey: []
      responses:
        "200":
          description: The organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "401":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateOrg
      tags: [org]
      summary: Change the approval threshold. Admins only.
      description: |
        Runs whose total is above the threshold wait for an approver who is
        not their creator. Changing it does not affect runs already
        approved.
      security:
        - memberKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrgRequest"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"

  /v1/org/members:
    get:
      operationId: listMembers
      tags: [org]
      summary: The organisation's members, including removed ones.
      security:
        - memberKey: []
      responses:
        "200":
          description: The members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: addMember
      tags: [org]
      summary: Add a member and create their first API key. Admins only.
      description: |
        The new member's API key is in this response only; Waybill stores a
        SHA-256 hash of it. Give it to the member over a private channel.
      security:
        - memberKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
      responses:
        "201":
          description: Added. `apiKey` is shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddedMember"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"

  /v1/org/members/{id}:
    patch:
      operationId: updateMember
      tags: [org]
      summary: Change a member's roles, or remove them. Admins only.
      description: |
        A removed member's keys stop working at once. The organisation's
        last admin cannot be removed or lose the admin role (409).
      security:
        - memberKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRequest"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /v1/org/funding:
    get:
      operationId: getFunding
      tags: [org]
      summary: Where to send test USDC to fund batch runs, and the balance.
      description: |
        One deposit address per network, unique to the organisation and
        permanent. Money sent there is `pending` until the payment is final
        on-chain, then `available` for runs.
      security:
        - memberKey: []
      responses:
        "200":
          description: Funding addresses and balances.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Funding"
        "401":
          $ref: "#/components/responses/Problem"

  /v1/me/payout-wallet:
    get:
      operationId: listPayoutWallets
      tags: [payouts]
      summary: The contractor's payout wallets, one per network.
      security:
        - contractorKey: []
      responses:
        "200":
          description: The wallets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutWalletList"
        "401":
          $ref: "#/components/responses/Problem"
    put:
      operationId: setPayoutWallet
      tags: [payouts]
      summary: Set or change the wallet that batch runs pay on a network.
      description: |
        Saving the same address again changes nothing. A new or changed
        address can be paid only after 24 hours (`payoutsAllowedFrom`), so a
        stolen API key cannot redirect a run at once.
      security:
        - contractorKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPayoutWalletRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutWallet"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /v1/batches:
    post:
      operationId: createBatch
      tags: [batches]
      summary: Build a run and check every line. Makers only.
      description: |
        Each line is checked: the contractor is verified, has a payout
        wallet on the network that is past its 24-hour wait, the amount is
        within the vault's limit per payment, and the same contractor and
        reference were not paid by the organisation in the last 30 days.
        The total must be within the organisation's available balance.

        A run whose lines all pass is `ready`, or `awaiting_approval` when
        its total is above the threshold. Otherwise it stays `draft`, each
        problem stated on its line (or in `problem` for the run), and can
        only be cancelled; build a corrected run.
      security:
        - memberKey: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBatchRequest"
      responses:
        "201":
          description: Built and checked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    get:
      operationId: listBatches
      tags: [batches]
      summary: The organisation's 50 newest runs, without their lines.
      security:
        - memberKey: []
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchList"
        "401":
          $ref: "#/components/responses/Problem"

  /v1/batches/{id}:
    get:
      operationId: getBatch
      tags: [batches]
      summary: One run with its lines and approvals.
      security:
        - memberKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /v1/batches/{id}/approve:
    post:
      operationId: approveBatch
      tags: [batches]
      summary: Approve a run above the threshold. Approvers only.
      description: |
        Nobody approves their own run (403), whatever roles they hold; the
        database refuses it too. The run can then be sent.
      security:
        - memberKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The run after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /v1/batches/{id}/reject:
    post:
      operationId: rejectBatch
      tags: [batches]
      summary: Refuse a run above the threshold. Approvers only.
      description: |
        A rejected run can never be sent.
      security:
        - memberKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The run after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /v1/batches/{id}/send:
    post:
      operationId: sendBatch
      tags: [batches]
      summary: Send a run. Makers only.
      description: |
        Sends an approved run, or a ready run at or below the threshold.
        The total is reserved from the organisation's balance and the run
        is recorded as `sending` before the transaction goes out; the run
        is then paid in one `BatchPayout` transaction. 409 if the run is
        not sendable, 422 if the balance or the vault's daily limit is
        short or a wallet changed since the run was checked.
      security:
        - memberKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The run after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /v1/batches/{id}/cancel:
    post:
      operationId: cancelBatch
      tags: [batches]
      summary: Withdraw a run that has not been sent. Makers and admins.
      description: |
        A run cannot be cancelled once it is sending.
      security:
        - memberKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The run after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /v1/invoices/{id}/document.pdf:
    get:
      operationId: getInvoiceDocument
      tags: [documents]
      summary: The invoice as a PDF.
      security:
        - contractorKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The invoice.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /v1/invoices/{id}/receipt:
    get:
      operationId: getInvoiceReceipt
      tags: [documents]
      summary: What arrived for a settled invoice, and what was sent on.
      security:
        - contractorKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceReceipt"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /v1/invoices/{id}/receipt.pdf:
    get:
      operationId: getInvoiceReceiptPdf
      tags: [documents]
      summary: The receipt for a settled invoice, as a PDF.
      security:
        - contractorKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The receipt.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /v1/batches/{id}/receipt:
    get:
      operationId: getBatchReceipt
      tags: [documents]
      summary: The receipt for a paid run.
      security:
        - memberKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchReceipt"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /v1/batches/{id}/receipt.pdf:
    get:
      operationId: getBatchReceiptPdf
      tags: [documents]
      summary: The receipt for a paid run, as a PDF.
      security:
        - memberKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The receipt.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /v1/exports/ledger.csv:
    get:
      operationId: exportLedger
      tags: [documents]
      summary: The caller's own postings in a date range, as CSV for an accountant.
      description: |
        One row per posting on the caller's available balances, oldest
        first: `date, waybill_reference, description, asset, money_in,
        money_out, balance, chain_tx, provider_reference`. Amounts are
        decimals in the asset's unit. A cell that a spreadsheet would run as
        a formula is prefixed with `'`. A contractor key exports the
        contractor's balances; a member key, the organisation's.
      security:
        - contractorKey: []
        - memberKey: []
      parameters:
        - name: from
          in: query
          required: true
          description: First day included (UTC).
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: First day not included (UTC). At most 366 days after `from`.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The export.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /v1/me/balance:
    get:
      operationId: getBalance
      tags: [payouts]
      summary: The contractor's balances and recent conversions.
      security:
        - contractorKey: []
      responses:
        "200":
          description: The balances.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
        "401":
          $ref: "#/components/responses/Problem"

  /v1/me/conversions:
    post:
      operationId: quoteConversion
      tags: [payouts]
      summary: Quote a conversion of USDC balance to naira.
      description: |
        Fixes a rate and the naira amount until `expiresAt` (two minutes).
        Nothing moves until the quote is accepted. Needs a verified bank
        account and at least the amount available; the minimum is 1 USDC.
      security:
        - contractorKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversionRequest"
      responses:
        "201":
          description: The quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversion"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"

  /v1/me/conversions/{id}:
    get:
      operationId: getConversion
      tags: [payouts]
      summary: One conversion and its payout.
      security:
        - contractorKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The conversion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversion"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /v1/me/conversions/{id}/accept:
    post:
      operationId: acceptConversion
      tags: [payouts]
      summary: Accept a quote before it expires; the naira is sent to the bank.
      description: |
        Books the conversion and queues a payout to the verified bank
        account. After `expiresAt` it is refused with 409 `quote-expired`:
        ask for a new quote. Accepting an accepted conversion returns it.
      security:
        - contractorKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The accepted conversion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversion"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    contractorKey:
      type: http
      scheme: bearer
      description: A contractor API key, `wb_test_…`.
    memberKey:
      type: http
      scheme: bearer
      description: An organisation member's API key, `wb_test_…`.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique per logical request, 1–255 printable ASCII characters.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TrackingCode:
      name: code
      in: path
      required: true
      description: Tracking code, for example `WB-7KQ4-M2XD-9PRA-3HNC`.
      schema:
        type: string
        pattern: "^WB(-[0-9A-HJKMNP-TV-Z]{4}){4}$"

  responses:
    Problem:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    ConversionRequest:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount:
          type: string
          description: USDC to convert, as a decimal string, at least "1".
          example: "40.50"

    Conversion:
      type: object
      additionalProperties: false
      required: [id, state, amount, naira, rate, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [quoted, expired, accepted]
        amount:
          $ref: "#/components/schemas/Amount"
        naira:
          $ref: "#/components/schemas/Amount"
        rate:
          description: Naira per 1 USDC.
          allOf:
            - $ref: "#/components/schemas/Amount"
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
        payout:
          $ref: "#/components/schemas/ConversionPayout"

    ConversionPayout:
      type: object
      additionalProperties: false
      required: [state, reference]
      properties:
        state:
          type: string
          description: The payout's state, as on an invoice payout.
        reference:
          type: string

    Balance:
      type: object
      additionalProperties: false
      required: [usdcAvailable, usdcPending, nairaOnItsWay, conversions]
      properties:
        usdcAvailable:
          $ref: "#/components/schemas/Amount"
        usdcPending:
          description: Received, not yet final.
          allOf:
            - $ref: "#/components/schemas/Amount"
        nairaOnItsWay:
          description: Converted, not yet sent to the bank.
          allOf:
            - $ref: "#/components/schemas/Amount"
        conversions:
          type: array
          items:
            $ref: "#/components/schemas/Conversion"

    InvoiceReceipt:
      type: object
      additionalProperties: false
      required: [invoiceId, trackingCode, contractorName, description, amount, received, settledAt, payments]
      properties:
        invoiceId:
          type: string
          format: uuid
        trackingCode:
          type: string
        contractorName:
          type: string
        description:
          type: string
        amount:
          $ref: "#/components/schemas/Amount"
        received:
          description: The sum of the final on-chain payments.
          allOf:
            - $ref: "#/components/schemas/Amount"
        settledAt:
          type: string
          format: date-time
        payments:
          type: array
          items:
            $ref: "#/components/schemas/ReceiptPayment"
        card:
          $ref: "#/components/schemas/ReceiptCard"
        payout:
          $ref: "#/components/schemas/ReceiptPayout"

    ReceiptPayment:
      type: object
      additionalProperties: false
      required: [network, txHash, amount, finalAt]
      properties:
        network:
          type: string
        txHash:
          type: string
        amount:
          $ref: "#/components/schemas/Amount"
        finalAt:
          type: string
          format: date-time

    ReceiptCard:
      type: object
      additionalProperties: false
      required: [reference, amount, paidAt]
      properties:
        reference:
          type: string
        amount:
          $ref: "#/components/schemas/Amount"
        paidAt:
          type: string
          format: date-time

    ReceiptPayout:
      type: object
      additionalProperties: false
      required: [state, naira, reference]
      properties:
        state:
          type: string
        naira:
          $ref: "#/components/schemas/Amount"
        rate:
          description: Naira per one unit of the invoice's asset.
          allOf:
            - $ref: "#/components/schemas/Amount"
        reference:
          type: string
        sentAt:
          type: string
          format: date-time

    BatchReceipt:
      type: object
      additionalProperties: false
      required: [id, organisation, network, total, txHash, paidAt, createdBy, approvedBy, lines]
      properties:
        id:
          type: string
          format: uuid
        organisation:
          type: string
        network:
          type: string
        total:
          $ref: "#/components/schemas/Amount"
        txHash:
          type: string
        paidAt:
          type: string
          format: date-time
        createdBy:
          type: string
          description: The member's name.
        approvedBy:
          type: array
          items:
            type: string
        sentBy:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/BatchReceiptLine"

    BatchReceiptLine:
      type: object
      additionalProperties: false
      required: [lineNo, contractorName, wallet, amount, reference, trackingCode]
      properties:
        lineNo:
          type: integer
        contractorName:
          type: string
        wallet:
          type: string
        amount:
          $ref: "#/components/schemas/Amount"
        reference:
          type: string
        trackingCode:
          type: string

    Health:
      type: object
      additionalProperties: false
      required: [status, version, database, networks, testMode]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          description: Build version of the running binary.
          example: 0.1.0-dev
        database:
          type: string
          enum: [ok, unavailable]
        networks:
          type: array
          description: Configured networks, each verified as a test network at startup.
          items:
            type: string
            example: evm:31337
        testMode:
          type: boolean
          description: Always true. The service refuses to start otherwise.
        rpc:
          type: array
          description: |
            Each network's RPC endpoints, primary first (ADR-045). An endpoint is
            named by its host only. When every endpoint of a network is down,
            `status` is `degraded`.
          items:
            $ref: "#/components/schemas/RPCNetwork"

    RPCNetwork:
      type: object
      additionalProperties: false
      required: [network, endpoints]
      properties:
        network:
          type: string
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/RPCEndpoint"

    RPCEndpoint:
      type: object
      additionalProperties: false
      required: [name, state, current, head]
      properties:
        name:
          type: string
          description: The host, never the full URL (it can carry an API key).
        state:
          type: string
          enum: [up, lagging, down]
        current:
          type: boolean
          description: The endpoint calls go to now.
        head:
          type: integer
          format: int64
          description: The last block height it reported.

    Amount:
      type: object
      additionalProperties: false
      required: [asset, minor, scale]
      description: An exact amount. `minor` / 10^`scale` is the value in major units.
      properties:
        asset:
          type: string
          example: USDC
        minor:
          type: string
          pattern: "^-?(0|[1-9][0-9]{0,77})$"
          description: Minor units as a base-10 integer string.
          example: "125500000"
        scale:
          type: integer
          minimum: 0
          maximum: 18
          example: 6

    CreateInvoiceRequest:
      type: object
      additionalProperties: false
      required: [description, amount, asset, payout]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 500
          example: Design work, September
        amount:
          type: string
          description: Major units as a decimal string, at most the asset's scale in decimals.
          pattern: "^(0|[1-9][0-9]*)(\\.[0-9]+)?$"
          example: "125.50"
        asset:
          type: string
          enum: [USDC, BTC]
          description: |
            `BTC` invoices are paid on Bitcoin test networks to a fresh address
            derived from an extended public key, and are held in BTC: payout
            must be `hold` (ADR-045).
        payout:
          type: string
          enum: [naira, hold]
          description: |
            `hold` keeps the stablecoin (or BTC) in the contractor's balance. `naira`
            locks a rate now (see `Quote`) and sends naira to the verified bank
            account once the invoice settles. `naira` needs a verified bank
            account and an available rate: without either it is a 422 or a
            503, and the invoice is not created.

    InvoiceState:
      type: string
      enum: [open, received, underpaid, overpaid, confirmed, settled, expired, cancelled]

    DepositAddress:
      type: object
      additionalProperties: false
      required: [network, address]
      properties:
        network:
          type: string
          example: evm:84532
        address:
          type: string
          description: |
            Unique to this invoice and network. EVM: EIP-55 checksummed `0x…`.
            Bitcoin: a bech32 P2WPKH address (`bcrt1…` on regtest, `tb1…` on signet).
        token:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"
          description: EVM only. The only token contract accepted at this address.
        uri:
          type: string
          description: |
            Bitcoin only. A BIP21 `bitcoin:` URI with the invoice amount, for
            wallets and QR codes.

    Invoice:
      type: object
      additionalProperties: false
      required: [id, trackingCode, payUrl, trackUrl, state, description, amount, payout, depositAddresses, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        trackingCode:
          type: string
          example: WB-7KQ4-M2XD-9PRA-3HNC
        payUrl:
          type: string
          format: uri
        trackUrl:
          type: string
          format: uri
        state:
          $ref: "#/components/schemas/InvoiceState"
        description:
          type: string
        amount:
          $ref: "#/components/schemas/Amount"
        payout:
          type: string
          enum: [naira, hold]
        depositAddresses:
          type: array
          items:
            $ref: "#/components/schemas/DepositAddress"
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        quote:
          allOf:
            - $ref: "#/components/schemas/Quote"
          nullable: true
          description: Present when payout is `naira`.
        payoutStatus:
          allOf:
            - $ref: "#/components/schemas/Payout"
          nullable: true
          description: The naira payout, present once a naira invoice has settled.

    PaymentLink:
      type: object
      additionalProperties: false
      required: [trackingCode, contractorName, verified, description, amount, depositAddresses, state, expiresAt]
      properties:
        trackingCode:
          type: string
        contractorName:
          type: string
          description: The contractor's legal name, shown before any address.
        verified:
          type: boolean
          description: True when the name has been verified against the contractor's bank account.
        description:
          type: string
        amount:
          $ref: "#/components/schemas/Amount"
        depositAddresses:
          type: array
          items:
            $ref: "#/components/schemas/DepositAddress"
        state:
          $ref: "#/components/schemas/InvoiceState"
        expiresAt:
          type: string
          format: date-time
        naira:
          $ref: "#/components/schemas/PaymentLinkNaira"

    PaymentLinkNaira:
      type: object
      additionalProperties: false
      required: [amount, expiresAt]
      description: |
        Present only when the link can be paid in naira by card or bank
        transfer right now (`startCheckout` would accept it): the invoice is
        open, pays out in naira, its quote has not expired and card pay-in
        is configured. Absent otherwise; the stablecoin addresses always
        work.
      properties:
        amount:
          $ref: "#/components/schemas/Amount"
        expiresAt:
          type: string
          format: date-time
          description: When the locked rate, and so this naira amount, expires.

    MemberRole:
      type: string
      enum: [admin, maker, approver]
      description: |
        `admin` manages members and the threshold, `maker` builds and sends
        runs, `approver` approves runs above the threshold. A member may
        hold several; nobody approves their own run.

    Org:
      type: object
      additionalProperties: false
      required: [id, name, approvalThreshold, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        approvalThreshold:
          $ref: "#/components/schemas/Amount"
        createdAt:
          type: string
          format: date-time

    UpdateOrgRequest:
      type: object
      additionalProperties: false
      required: [approvalThreshold]
      properties:
        approvalThreshold:
          type: string
          pattern: "^(0|[1-9][0-9]*)(\\.[0-9]+)?$"
          description: In USDC, as a decimal string, for example `"500"`.
          example: "500"

    Member:
      type: object
      additionalProperties: false
      required: [id, name, roles, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/MemberRole"
        createdAt:
          type: string
          format: date-time
        removedAt:
          type: string
          format: date-time
          nullable: true

    MemberList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Member"

    AddMemberRequest:
      type: object
      additionalProperties: false
      required: [name, roles]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/MemberRole"

    AddedMember:
      type: object
      additionalProperties: false
      required: [member, apiKey]
      properties:
        member:
          $ref: "#/components/schemas/Member"
        apiKey:
          type: string
          description: The member's API key. Shown once.

    UpdateMemberRequest:
      type: object
      additionalProperties: false
      properties:
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/MemberRole"
        removed:
          type: boolean
          description: "`true` removes the member. Removal is permanent."

    Funding:
      type: object
      additionalProperties: false
      required: [depositAddresses, pending, available]
      properties:
        depositAddresses:
          type: array
          items:
            $ref: "#/components/schemas/DepositAddress"
        pending:
          $ref: "#/components/schemas/Amount"
        available:
          $ref: "#/components/schemas/Amount"

    PayoutWallet:
      type: object
      additionalProperties: false
      required: [network, address, addedAt, payoutsAllowedFrom]
      properties:
        network:
          type: string
          example: evm:84532
        address:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"
        addedAt:
          type: string
          format: date-time
        payoutsAllowedFrom:
          type: string
          format: date-time

    PayoutWalletList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PayoutWallet"

    SetPayoutWalletRequest:
      type: object
      additionalProperties: false
      required: [network, address]
      properties:
        network:
          type: string
          example: evm:84532
        address:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"

    BatchState:
      type: string
      enum: [draft, ready, awaiting_approval, approved, sending, confirming, paid, failed, rejected, cancelled]

    CreateBatchRequest:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        network:
          type: string
          description: Defaults to the only network with a BatchPayout contract.
          example: evm:84532
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/CreateBatchLine"

    CreateBatchLine:
      type: object
      additionalProperties: false
      required: [contractorId, amount, reference]
      properties:
        contractorId:
          type: string
          format: uuid
        amount:
          type: string
          description: USDC, as a decimal string.
          pattern: "^(0|[1-9][0-9]*)(\\.[0-9]+)?$"
          example: "250"
        reference:
          type: string
          minLength: 1
          maxLength: 140
          example: September retainer

    BatchLine:
      type: object
      additionalProperties: false
      required: [lineNo, contractorId, contractorName, verified, amount, reference, trackingCode]
      properties:
        lineNo:
          type: integer
        contractorId:
          type: string
          format: uuid
        contractorName:
          type: string
          description: The contractor's legal name, so the approver sees who is paid.
        verified:
          type: boolean
        walletAddress:
          type: string
          nullable: true
        amount:
          $ref: "#/components/schemas/Amount"
        reference:
          type: string
        problem:
          type: string
          nullable: true
          description: Why this line cannot be paid. Absent when it can.
        trackingCode:
          type: string

    Approval:
      type: object
      additionalProperties: false
      required: [approverId, decision, decidedAt]
      properties:
        approverId:
          type: string
          format: uuid
        decision:
          type: string
          enum: [approved, rejected]
        decidedAt:
          type: string
          format: date-time

    Batch:
      type: object
      additionalProperties: false
      required: [id, state, network, total, createdBy, needsApproval, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/BatchState"
        network:
          type: string
        total:
          $ref: "#/components/schemas/Amount"
        createdBy:
          type: string
          format: uuid
        needsApproval:
          type: boolean
          description: The total is above the organisation's threshold.
        problem:
          type: string
          nullable: true
          description: Why the run cannot be sent, or why it failed.
        txHash:
          type: string
          nullable: true
        lines:
          type: array
          items:
            $ref: "#/components/schemas/BatchLine"
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/Approval"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BatchList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Batch"

    TrackingStep:
      type: object
      additionalProperties: false
      required: [step, status]
      properties:
        step:
          type: string
          enum: [received, confirmed, converted, sent_to_bank]
        status:
          type: string
          enum: [done, current, waiting, checking, skipped]
          description: |
            `checking` means Waybill could not find out yet; it is never
            shown as a failure. `skipped` is used for converted and
            sent_to_bank when the contractor keeps the stablecoin.
        at:
          type: string
          format: date-time
          nullable: true

    Tracking:
      type: object
      additionalProperties: false
      required: [trackingCode, contractorName, amount, invoiceState, steps, updatedAt]
      properties:
        trackingCode:
          type: string
        contractorName:
          type: string
        amount:
          $ref: "#/components/schemas/Amount"
        invoiceState:
          $ref: "#/components/schemas/InvoiceState"
        steps:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/TrackingStep"
        updatedAt:
          type: string
          format: date-time

    CreateApiKeyRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: A label to tell keys apart, e.g. where the key is used.
          example: Accounting export

    ApiKey:
      type: object
      additionalProperties: false
      required: [id, name, prefix, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          pattern: "^wb_test_[0-9a-z]{8}$"
          description: The public start of the key, enough to recognise it.
          example: wb_test_k3m9x2qa
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true

    CreatedApiKey:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: The full key. Shown once; store it now.
              example: wb_test_k3m9x2qa_7Hq2pV9sLw4nX8rT1mZb6cYd

    ApiKeyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"

    WebhookEventType:
      type: string
      description: |
        Invoice state changes, named after the state reached.
        `invoice.reopened` means a reorg removed a payment and the invoice is
        open again while Waybill rechecks the chain.
      enum:
        - invoice.received
        - invoice.underpaid
        - invoice.overpaid
        - invoice.confirmed
        - invoice.settled
        - invoice.expired
        - invoice.reopened

    CreateWebhookEndpointRequest:
      type: object
      additionalProperties: false
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2000
          pattern: "^https://"
          example: https://example.com/hooks/waybill
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WebhookEventType"
        description:
          type: string
          maxLength: 200

    WebhookEndpoint:
      type: object
      additionalProperties: false
      required: [id, url, events, enabled, createdAt]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventType"
        description:
          type: string
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreatedWebhookEndpoint:
      allOf:
        - $ref: "#/components/schemas/WebhookEndpoint"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: The signing secret. Shown once; store it now.
              pattern: "^whsec_test_[0-9A-Za-z]{32}$"

    WebhookEndpointList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEndpoint"

    WebhookDelivery:
      type: object
      additionalProperties: false
      required: [id, eventId, eventType, attempt, outcome, createdAt]
      description: One attempt to deliver one event.
      properties:
        id:
          type: integer
          format: int64
        eventId:
          type: string
          example: evt_01J9ZQ7W3X4Y5Z6A7B8C9D0E1F
        eventType:
          $ref: "#/components/schemas/WebhookEventType"
        attempt:
          type: integer
          minimum: 1
        outcome:
          type: string
          enum: [succeeded, failed, refused]
          description: |
            `succeeded`: a 2xx response. `failed`: any other response, a
            timeout or a connection error; retried with backoff. `refused`:
            the URL resolved to a private address and nothing was sent.
        responseStatus:
          type: integer
          nullable: true
          description: The HTTP status received, if any.
        latencyMs:
          type: integer
          nullable: true
        error:
          type: string
          nullable: true
          description: Why it failed, without the response body.
        nextAttemptAt:
          type: string
          format: date-time
          nullable: true
          description: When the next retry runs; null after success or the last attempt.
        createdAt:
          type: string
          format: date-time

    WebhookDeliveryList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDelivery"
        nextBefore:
          type: integer
          format: int64
          nullable: true
          description: Pass as `before` for the next page; null on the last page.

    WebhookEvent:
      type: object
      additionalProperties: false
      required: [id, type, createdAt, data]
      description: |
        The body Waybill POSTs to a webhook endpoint (`Content-Type:
        application/json`). Not an endpoint of this API; defined here so
        clients can generate a type for it.

        **Signature.** Each request has a header
        `Waybill-Signature: t=<unix seconds>,v1=<hex>`, where `<hex>` is
        HMAC-SHA256 with the endpoint secret over `<t>.<raw body>`. Verify
        the HMAC over the raw bytes before parsing, compare in constant
        time, and reject a `t` more than five minutes from now.

        **Delivery.** At least once. The same event can arrive more than
        once with the same `id`: process each `id` once. Events can arrive
        out of order; `data.invoice.state` is the state when the event was
        created. A non-2xx response or no response within 10 seconds is
        retried with exponential backoff for about 24 hours.
      properties:
        id:
          type: string
          pattern: "^evt_[0-9A-Z]{26}$"
          description: Unique per event, the same on every retry.
        type:
          $ref: "#/components/schemas/WebhookEventType"
        createdAt:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: false
          required: [invoice]
          properties:
            invoice:
              $ref: "#/components/schemas/Invoice"

    Bank:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          pattern: "^[0-9]{3,6}$"
          example: "058"
        name:
          type: string
          example: Guaranty Trust Bank

    BankList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Bank"

    SetBankAccountRequest:
      type: object
      additionalProperties: false
      required: [bankCode, accountNumber]
      properties:
        bankCode:
          type: string
          pattern: "^[0-9]{3,6}$"
        accountNumber:
          type: string
          pattern: "^[0-9]{10}$"
          description: A 10-digit NUBAN.

    BankAccount:
      type: object
      additionalProperties: false
      required: [bankCode, bankName, accountNumberLast4, accountName, verifiedAt, payoutsAllowedFrom]
      properties:
        bankCode:
          type: string
        bankName:
          type: string
        accountNumberLast4:
          type: string
          pattern: "^[0-9]{4}$"
          description: Only the last four digits are ever shown again.
        accountName:
          type: string
          description: The name the bank holds, which matched the legal name.
        verifiedAt:
          type: string
          format: date-time
        payoutsAllowedFrom:
          type: string
          format: date-time
          description: 24 hours after the account was last changed.

    Quote:
      type: object
      additionalProperties: false
      required: [rate, nairaAmount, spreadBps, source, quotedAt, expiresAt]
      description: |
        The naira the contractor receives for this invoice, locked when the
        invoice was created. `rate` is naira per 1 USDC as an exact Amount
        (kobo, scale 2). A late payment is re-quoted.
      properties:
        rate:
          $ref: "#/components/schemas/Amount"
        nairaAmount:
          $ref: "#/components/schemas/Amount"
        spreadBps:
          type: integer
          minimum: 0
          maximum: 9999
          description: Waybill's margin in basis points, already taken out of `rate`.
        source:
          type: string
          example: ExchangeRate-API
        quotedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    PayoutState:
      type: string
      enum: [queued, converted, held, submitting, submitted, unknown, succeeded, failed, reversed, cancelled]
      description: |
        `unknown` means the provider did not answer and Waybill is checking
        with it by reference; it is never shown as failed.

    Payout:
      type: object
      additionalProperties: false
      required: [state, nairaAmount, updatedAt]
      properties:
        state:
          $ref: "#/components/schemas/PayoutState"
        nairaAmount:
          $ref: "#/components/schemas/Amount"
        bankName:
          type: string
        accountNumberLast4:
          type: string
        failureReason:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time

    Checkout:
      type: object
      additionalProperties: false
      required: [authorizationUrl, reference, amount, expiresAt]
      properties:
        authorizationUrl:
          type: string
          format: uri
          description: Paystack's test checkout page.
        reference:
          type: string
        amount:
          $ref: "#/components/schemas/Amount"
        expiresAt:
          type: string
          format: date-time

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          description: A URI reference identifying the problem type.
          example: https://waybill.dev/problems/validation
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
