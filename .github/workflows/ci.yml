name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: go vet
        working-directory: api
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: api
      - name: Test (unit + testcontainers integration)
        working-directory: api
        run: go test ./...

  contracts:
    name: contracts (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - name: Format
        working-directory: contracts
        run: forge fmt --check
      - name: Test
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: ci
        run: forge test -vvv

  web:
    name: web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Audit production dependencies (dev-only advisory accepted in ADR-026)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  codegen:
    name: codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make check-gen

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # scan every commit, not only the tip
      - run: make secrets

  stack:
    name: compose stack and end-to-end
    runs-on: ubuntu-latest
    needs: [api, web, contracts]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive # the contracts container deploys from source
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make up
      - name: API health
        run: curl --fail --silent --show-error http://localhost:8080/v1/health
      - name: Web reaches API
        # The status block streams in only after the web server fetched /v1/health.
        run: curl --fail --silent --show-error http://localhost:3000/ | grep -q "The Waybill service is running."
      - name: End-to-end (Playwright, mobile profile)
        run: make e2e
      - name: JavaScript budgets
        if: success() || failure() # report budgets even when an e2e test fails
        run: make budget
      - name: Lighthouse budgets (mobile, simulated slow 4G)
        if: success() || failure()
        run: make lighthouse
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7
      - name: Upload Lighthouse reports
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: web/lighthouse-results/
          retention-days: 14
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml logs
      - if: always()
        run: make down
