# Waybill local stack. Default services stay small enough for a 7 GB WSL2
# machine (docs/DECISIONS.md ADR-019). Heavier services go behind profiles.
#
#   make up    build and start, wait until healthy
#   make down  stop and remove containers and volumes
#
# Every value here is a local-only default for test networks. Real secrets
# never belong in this file; they come from the environment.
#
# Host ports bind to 127.0.0.1 and can be overridden to avoid clashes:
# WAYBILL_PG_PORT (55432), WAYBILL_ANVIL_PORT (58545), WAYBILL_API_PORT (8080),
# WAYBILL_WEB_PORT (3000).
name: waybill

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: waybill
      POSTGRES_PASSWORD: waybill-local-only
      POSTGRES_DB: waybill
    ports: ["127.0.0.1:${WAYBILL_PG_PORT:-55432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      # TCP, not the socket: during first-boot init the image runs a socket-only
      # temporary server, which would report ready before the real one starts.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U waybill -d waybill"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.8.3
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "31337", "--block-time", "2"]
    ports: ["127.0.0.1:${WAYBILL_ANVIL_PORT:-58545}:8545"]
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 256m

  # One-shot: deploy the contracts to Anvil and record their addresses in
  # the `deployments` volume. The image compiles at build time, so this
  # needs no network. Anvil's dev accounts are unlocked: no private key is
  # needed or stored anywhere.
  contracts:
    build: ../contracts
    image: waybill-contracts:local
    command: ["--rpc-url", "http://anvil:8545", "--unlocked",
              "--sender", "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"]
    environment:
      FOUNDRY_BROADCAST: /tmp/broadcast
    volumes:
      - deployments:/contracts/deployments
    depends_on:
      anvil: { condition: service_healthy }
    restart: "no"

  # The API image is built once, here, and reused by seed, api and watcher.
  migrate:
    build: ../api
    image: waybill-api:local
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://waybill:waybill-local-only@postgres:5432/waybill?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # One-shot: the demo contractor and its API key. The key is random per
  # machine, generated by `make up` into deploy/.env (git-ignored).
  seed:
    image: waybill-api:local
    pull_policy: never
    command: ["seed-dev"]
    environment: &app-env
      DATABASE_URL: postgres://waybill:waybill-local-only@postgres:5432/waybill?sslmode=disable
      WAYBILL_CHAINS: evm:31337=http://anvil:8545
      WAYBILL_DEPLOYMENTS_DIR: /deployments
      WAYBILL_WEB_URL: http://localhost:${WAYBILL_WEB_PORT:-3000}
      WAYBILL_DEV_CONTRACTOR_KEY: ${WAYBILL_DEV_CONTRACTOR_KEY:?run make up, which generates deploy/.env}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  api:
    image: waybill-api:local
    pull_policy: never
    command: ["api"]
    environment:
      <<: *app-env
      HTTP_ADDR: ":8080"
    volumes: [deployments:/deployments:ro]
    ports: ["127.0.0.1:${WAYBILL_API_PORT:-8080}:8080"]
    depends_on:
      seed: { condition: service_completed_successfully }
      contracts: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/usr/local/bin/waybill", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 256m

  watcher:
    image: waybill-api:local
    pull_policy: never
    command: ["watcher"]
    environment: *app-env
    volumes: [deployments:/deployments:ro]
    depends_on:
      seed: { condition: service_completed_successfully }
      contracts: { condition: service_completed_successfully }
    restart: unless-stopped
    mem_limit: 128m

  web:
    build: ../web
    environment:
      API_INTERNAL_URL: http://api:8080
      WAYBILL_DEV_CONTRACTOR_KEY: ${WAYBILL_DEV_CONTRACTOR_KEY}
    ports: ["127.0.0.1:${WAYBILL_WEB_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 512m

  # Opt-in: `docker compose --profile bitcoin up`. Used from stage 5.
  bitcoind:
    profiles: [bitcoin]
    image: bitcoin/bitcoin:29.4
    command: ["-regtest=1", "-server=1", "-rpcbind=0.0.0.0", "-rpcallowip=0.0.0.0/0", "-rpcuser=waybill", "-rpcpassword=waybill-local-only", "-fallbackfee=0.0002"]
    ports: ["127.0.0.1:18443:18443"]
    mem_limit: 512m

volumes:
  pgdata:
  deployments:
