# Secret scanning (CI job "secrets"). Extends the default gitleaks rules.
[extend]
useDefault = true

# The test-money guard's tests use obviously fake Paystack keys to prove that
# live keys are rejected. Allow exactly those strings in exactly that file.
[[allowlists]]
description = "Fake Paystack keys in guard tests"
paths = ['''^api/internal/safety/guard_test\.go$''']
regexes = ['''(sk|pk)_(test|live)_abc123''', '''(?i)sk_test_abc123''']

# EVM addresses (20 bytes, 40 hex characters) are public identifiers, but
# JSON keys such as "token" make the generic rule treat them as secrets.
# Anchored to the whole match, so a 64-hex private key is never allowed.
[[allowlists]]
description = "Public EVM addresses"
regexTarget = "secret"
regexes = ['''^0x[0-9a-fA-F]{40}$''']

# The Paystack client and API tests use a made-up key with the test-key prefix.
[[allowlists]]
description = "Fake Paystack test key in unit tests"
paths = ['''^api/internal/paystack/paystack_test\.go$''', '''^api/internal/httpapi/invoices_test\.go$''']
regexes = ['''sk_test_waybill_fake_key_for_unit_tests_only''', '''sk_test_someone_else''']
