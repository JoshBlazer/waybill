[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# The deploy script records addresses in deployments/<chainId>.json.
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 256

[profile.ci.fuzz]
runs = 2000

[profile.default.invariant]
runs = 64
depth = 100

[profile.ci.invariant]
runs = 256
depth = 100

[fmt]
line_length = 100
